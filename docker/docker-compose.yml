# 文件名：docker-compose.yml
name: flashsale

services:
  mysql:
    image: mysql:8.4
    container_name: mysql8
    command: [
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--max_connections=300"
    ]
    environment:
      MYSQL_ROOT_PASSWORD: whc7777777   # ✅ 与健康检查保持一致
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # ✅ 用容器内环境变量；Compose 里需要用 $$ 逃逸，才能在容器内展开
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    container_name: redis7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  rabbitmq:
    # ✅ 构建内置延时插件的镜像，避免手工挂载 .ez
    image: rabbitmq:3.13-management-delayed
    build:
      context: .
      dockerfile: Dockerfile.rabbitmq
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # 管理台
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro   # ← 新增这一行
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  nacos:
    image: nacos/nacos-server:v2.5.1-slim
    container_name: nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"   # 关闭鉴权
      JVM_XMS: "256m"
      JVM_XMX: "512m"
      JVM_XMN: "128m"
      TZ: Asia/Shanghai
      # 如需持久化到上面 MySQL，请解除以下注释并初始化 nacos_config 库
      # SPRING_DATASOURCE_PLATFORM: "mysql"
      # MYSQL_SERVICE_HOST: "mysql"
      # MYSQL_SERVICE_PORT: "3306"
      # MYSQL_SERVICE_DB_NAME: "nacos_config"
      # MYSQL_SERVICE_USER: "root"
      # MYSQL_SERVICE_PASSWORD: "whc7777777"
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8848/nacos/"]
      interval: 10s
      timeout: 5s
      retries: 40

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
